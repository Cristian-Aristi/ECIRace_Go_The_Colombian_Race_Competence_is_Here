name: ECIRace GO - CD (imagen)

# Cada push a main prueba el código y publica la imagen del servidor
# en GitHub Container Registry (gratis). El servidor en AWS descarga esa imagen al arrancar.
#
# El despliegue en sí NO se hace desde aquí: AWS Academy Learner Lab entrega credenciales
# temporales que caducan con cada sesión, así que guardarlas como secreto de GitHub no sirve
# (y sería una mala práctica). El despliegue se hace con scripts/aws.py desde el equipo.

on:
  push:
    # Solo main: el servidor de AWS descarga ":latest", así que una rama sin revisar no debe publicarla
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ecirace-go

jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Pruebas
        run: mvn -B clean test

      - id: meta
        name: Nombre de la imagen (GHCR exige minúsculas)
        run: |
          IMG=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "img=$IMG" >> "$GITHUB_OUTPUT"
          echo "tag=$IMG:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.img }}:latest

      - name: Resumen
        run: |
          {
            echo "### Imagen publicada"
            echo "\`${{ steps.meta.outputs.tag }}\`"
            echo ""
            echo "Para desplegarla en AWS: \`python scripts/aws.py release\`"
          } >> "$GITHUB_STEP_SUMMARY"
