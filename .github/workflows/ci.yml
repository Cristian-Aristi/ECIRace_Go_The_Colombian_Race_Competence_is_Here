name: ECIRace GO - CI Server Pipeline

on:
  push:
    branches: [ "main", "sprint2" ]
  pull_request:
    branches: [ "main", "sprint2" ]

# Las acciones se fijan por SHA (no por etiqueta): una etiqueta movida no puede cambiar lo que corre
permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y Ejecutar Pruebas de Anti-Cheat y Concurrencia
        run: mvn clean test

      - name: Empaquetar Artefacto JAR
        run: mvn package -DskipTests