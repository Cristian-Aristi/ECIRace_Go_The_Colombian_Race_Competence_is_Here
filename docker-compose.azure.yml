# Override para observar ECIRace desplegado en Azure con el mismo Prometheus/Grafana del laboratorio.
# No se usa a mano: python scripts/azure.py monitor up|down  y  python scripts/azure.py k6 <perfil>
# (el script genera monitoring/prometheus-azure.yml con la URL de la Container App)
services:
  probe:
    environment:
      # En la nube el modo laboratorio está apagado: la sonda consulta la readiness de Actuator
      - PROBE_URL=${ECIRACE_AZURE_URL:-http://ecirace-server:8080}/actuator/health/readiness
    depends_on: !reset []

  prometheus:
    volumes:
      - ./monitoring/prometheus-azure.yml:/etc/prometheus/prometheus.yml:ro