spring.application.name=ECIRaceGO

# Datasource configuration (H2)
spring.datasource.url=jdbc:h2:mem:eciracedb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilitar consola visual de la base de datos en el navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---------------------------------------------------------------
# Observabilidad: equivalente al /metrics de la API del laboratorio
# ---------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,prometheus
# /actuator/health/readiness: lo que consulta la sonda (el /ready del laboratorio)
management.endpoint.health.probes.enabled=true
# Histograma de latencia con los mismos límites que lab_request_duration_seconds
management.metrics.distribution.slo.http.server.requests=5ms,10ms,25ms,50ms,100ms,150ms,250ms,500ms,1s,2s,5s
# Métricas de hilos de Tomcat (panel opcional)
server.tomcat.mbeanregistry.enabled=true
# Duración del tick del game loop (@Scheduled), para el tablero del proyecto
management.metrics.distribution.slo.tasks.scheduled.execution=1ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s

# ---------------------------------------------------------------
# Modo laboratorio: apagado por defecto; docker-compose lo enciende (ECIRACE_LAB_ENABLED=true)
# ---------------------------------------------------------------
ecirace.lab.enabled=false
ecirace.lab.token=arsw-local
ecirace.lab.delay-ms=0
ecirace.lab.capacity=0
