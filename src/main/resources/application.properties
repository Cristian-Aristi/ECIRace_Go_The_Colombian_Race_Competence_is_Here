spring.application.name=ECIRaceGO

# Datasource configuration (H2 en memoria para desarrollo; en la nube se usa PostgreSQL)
spring.datasource.url=jdbc:h2:mem:eciracedb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola H2 apagada por defecto. Para depurar en local: SPRING_PROFILES_ACTIVE=dev
spring.h2.console.enabled=false

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Errores sin detalles internos
server.error.include-stacktrace=never
server.error.include-message=never

# ---------------------------------------------------------------
# Seguridad (ver docs en README, sección Seguridad)
# ---------------------------------------------------------------
# Client ID web de Google Identity Services (no es secreto). Vacío = login con Google desactivado.
ecirace.google.client-id=${GOOGLE_CLIENT_ID:}
# Secreto (>= 32 bytes) que firma los tokens de sesión. Vacío = aleatorio en cada arranque.
ecirace.auth.token-secret=${ECIRACE_TOKEN_SECRET:}
# Orígenes extra permitidos para CORS y WebSocket (separados por comas). Vacío = solo el mismo origen.
ecirace.allowed-origins=${ECIRACE_ALLOWED_ORIGINS:}
# Simulador de ruta y botón "simular victoria" en la pantalla del corredor (solo para demos)
ecirace.demo-tools=${ECIRACE_DEMO_TOOLS:false}
# Máximo de salas simultáneas en memoria
ecirace.rooms.max=${ECIRACE_ROOMS_MAX:2000}
# Límite de peticiones por IP (apagar solo para pruebas de carga locales)
ecirace.ratelimit.enabled=${ECIRACE_RATELIMIT_ENABLED:true}

# ---------------------------------------------------------------
# Observabilidad: equivalente al /metrics de la API del laboratorio
# ---------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,prometheus
# /actuator/health/readiness: lo que consulta la sonda (el /ready del laboratorio)
management.endpoint.health.probes.enabled=true
# Histograma de latencia con los mismos límites que lab_request_duration_seconds
management.metrics.distribution.slo.http.server.requests=5ms,10ms,25ms,50ms,100ms,150ms,250ms,500ms,1s,2s,5s
# Métricas de hilos de Tomcat (panel opcional)
server.tomcat.mbeanregistry.enabled=true
# Duración del tick del game loop (@Scheduled), para el tablero del proyecto
management.metrics.distribution.slo.tasks.scheduled.execution=1ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s

# ---------------------------------------------------------------
# Modo laboratorio: apagado por defecto; docker-compose lo enciende (ECIRACE_LAB_ENABLED=true)
# El token NO tiene valor por defecto: scripts/lab.py genera uno aleatorio en .env
# ---------------------------------------------------------------
ecirace.lab.enabled=false
ecirace.lab.token=${ECIRACE_LAB_TOKEN:}
ecirace.lab.delay-ms=0
ecirace.lab.capacity=0
