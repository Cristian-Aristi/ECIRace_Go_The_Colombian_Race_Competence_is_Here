<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0e1a3a">
    <title>ECIRace GO · Centro de control</title>

    <link rel="stylesheet" href="vendor/leaflet-1.9.4/leaflet.css">
    <script src="vendor/leaflet-1.9.4/leaflet.js"></script>
    <script src="vendor/stomp-2.3.3/stomp.min.js"></script>

    <link rel="preload" href="fonts/pixelify-sans-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/vt323-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/game.css?v=6">
</head>
<body class="g-dash">

<div class="dashboard-overlay">
    <a href="index.html" class="g-logo g-logo--small" title="Pantalla de inicio">
        <span class="g-logo__main">ECIRACE <span class="g-flag"></span></span>
        <span class="g-logo__sub">GO!</span>
    </a>

    <section class="g-panel" style="display:flex; flex-direction:column; gap:10px;">
        <div class="g-panel__head" style="margin:0;">
            <span class="g-ico g-ico--lg" data-icon="map"></span>
            <h1 class="g-panel__title">Centro de control</h1>
            <span class="g-pill g-pill--blue" id="hostStatusBadge">CONECTANDO</span>
        </div>

        <div class="g-roomcode">
            <span>SALA <span id="roomCodeDisplay">CAMPUS-ECI</span></span>
            <button type="button" class="g-btn g-btn--gold" id="btnCopyRoom" title="Copiar código de sala">Copiar</button>
        </div>

        <div>
            <div class="g-kv"><span>Red</span><span id="status" style="color: var(--red);">Desconectado</span></div>
            <div class="g-kv"><span>Carrera</span><span id="raceStatusValue" style="color: var(--gold);">--</span></div>
            <div class="g-kv"><span>Pilotos en sala</span><span id="activeCount" style="color: var(--teal);">0 / 6</span></div>
        </div>

        <div class="runners-list-box" id="runnersList">
            <div style="color: var(--text-dim); text-align: center; padding: 6px 0;">Esperando pilotos en la sala...</div>
        </div>

        <button type="button" class="g-race-btn g-race-btn--start" id="btnStartRaceDashboard" style="display:none; min-height:66px; font-size: clamp(1.2rem, 5vw, 1.6rem);">
            <span class="g-ico" data-icon="flag"></span>
            <span class="g-btn-label">INICIAR CARRERA</span>
        </button>

        <button type="button" class="g-btn g-btn--block g-meta-btn" id="btnToggleMetaMode">
            <span class="g-ico" data-icon="target"></span>
            <span>Mover la meta: <span id="metaModeStatus">DESACTIVADO</span></span>
        </button>

        <details class="g-details">
            <summary>Consola de sockets</summary>
            <div class="log-box" id="eventLog">
                <div class="log-entry info">[SISTEMA] Esperando actividad en la sala...</div>
            </div>
        </details>

        <div class="g-quick">
            <a href="index.html" class="g-btn" title="Pantalla de inicio">
                <span class="g-ico" data-icon="home" style="width:20px;height:20px;"></span>Inicio
            </a>
            <a href="lobby.html" class="g-btn" title="Garaje del piloto">
                <span class="g-ico" data-icon="helmet" style="width:22px;height:20px;"></span>Garaje
            </a>
            <button type="button" class="g-btn g-btn--gold" id="btnShareLink" title="Copiar enlace de invitación">
                <span class="g-ico" data-icon="users" style="width:20px;height:20px;"></span>Invitar
            </button>
        </div>
    </section>
</div>

<!-- Tabla de posiciones: ordena a los pilotos por cercanía a la meta -->
<section class="leaderboard g-panel" id="leaderboard">
    <button type="button" class="lb-header" id="lbToggle" aria-expanded="true" aria-controls="lbBody">
        <span><span class="g-ico" data-icon="trophy" style="width:22px;height:22px;vertical-align:-3px;"></span> Posiciones</span>
        <span class="lb-chevron">▼</span>
    </button>
    <div class="lb-body" id="lbBody" aria-live="polite">
        <div class="lb-empty">Esperando pilotos...</div>
    </div>
    <div class="lb-footer" id="lbFooter">Ordenado por distancia a la meta</div>
</section>

<div id="map"></div>

<script src="js/game-ui.js?v=4"></script>
<script src="js/session.js?v=1"></script>
<script src="js/dashboard.js?v=12"></script>
</body>
</html>
