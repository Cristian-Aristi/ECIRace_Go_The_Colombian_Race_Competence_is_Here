# ---------------------------------------------------------------
# Perfil "cloud": se activa con SPRING_PROFILES_ACTIVE=cloud en cualquier despliegue en la nube.
# No depende de ningún proveedor: toda la configuración sensible llega por variables de entorno.
# Todo lo que no está aquí se hereda de application.properties.
# ---------------------------------------------------------------

# Base de datos: PostgreSQL si el despliegue define DB_URL; si no, H2 en memoria.
# Las credenciales nunca se escriben en el repositorio.
spring.datasource.url=${DB_URL:jdbc:h2:mem:eciracedb;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Pool pequeño: una sola instancia del servidor y una base de datos modesta
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# Si PostgreSQL aún está arrancando, esperar en lugar de fallar al primer intento
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=120000

# Sin consolas ni SQL en el log en la nube
spring.h2.console.enabled=false
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN

# Detrás de un proxy inverso que termina TLS: respetar X-Forwarded-*
server.forward-headers-strategy=framework
# Apagado ordenado al detener la instancia o actualizar el contenedor
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Actuator en un puerto aparte que NO se publica: Caddy solo reenvía /actuator/health y
# /actuator/prometheus (con usuario y contraseña) a este puerto. Así ninguna variante de ruta
# (p. ej. /actuator;x=1/prometheus) puede alcanzar Actuator a través del puerto 8080.
management.server.port=8081

# Modo laboratorio siempre apagado en la nube (no exponer /admin/config)
ecirace.lab.enabled=false
