# ---------------------------------------------------------------
# Perfil "azure": se activa en Azure Container Apps con SPRING_PROFILES_ACTIVE=azure
# Todo lo que no está aquí se hereda de application.properties.
# ---------------------------------------------------------------

# Base de datos: PostgreSQL Flexible Server si el despliegue pasa DB_URL; si no, H2 en memoria.
# (scripts/azure.py llena estas variables como secretos de la Container App)
spring.datasource.url=${DB_URL:jdbc:h2:mem:eciracedb;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Pool pequeño: un B1ms admite pocas conexiones y solo corre una réplica
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# Si Postgres aún está encendiéndose, esperar en lugar de fallar al primer intento
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=120000

# Nada de consolas ni SQL en el log: Log Analytics cobra por GB ingerido
spring.h2.console.enabled=false
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN

# Detrás del ingress de Azure (TLS termina en el proxy): respetar X-Forwarded-*
server.forward-headers-strategy=framework
# Apagado ordenado cuando Azure escala a cero o cambia de revisión
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Modo laboratorio siempre apagado en la nube (no exponer /admin/config)
ecirace.lab.enabled=false