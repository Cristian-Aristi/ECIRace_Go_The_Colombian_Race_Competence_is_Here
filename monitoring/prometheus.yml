global:
  scrape_interval: 5s
scrape_configs:
  - job_name: ecirace
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['ecirace-server:8080']
  - job_name: probe
    static_configs:
      - targets: ['probe:9101']
  # ARSW k6 JSON addon
  - job_name: k6-results
    static_configs:
      - targets: ["k6-results:9102"]
