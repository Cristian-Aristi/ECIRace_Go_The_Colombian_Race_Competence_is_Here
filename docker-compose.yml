# ECIRace GO + entorno del laboratorio ARSW de observabilidad y rendimiento.
# Igual que compose.yaml + compose.override.yaml del lab, con ECIRace en lugar de la API Python.
# Úselo con: python scripts/lab.py prepare | up | doctor | sample | fault | reset | test all | improve | real | proyecto all | down
version: '3.8'

services:
  ecirace-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecirace-central-server
    ports:
      # Solo en este equipo: /admin/config (modo laboratorio) no debe quedar expuesto a la red local.
      # Para probar con celulares use un túnel HTTPS (ngrok) hacia localhost:8080 y defina
      # ECIRACE_ALLOWED_ORIGINS con la URL del túnel en el archivo .env.
      - "127.0.0.1:8080:8080"
    environment:
      - ECIRACE_LAB_ENABLED=true   # habilita /admin/config (falla, espera y cupos del laboratorio)
      # Valores aleatorios que genera "python scripts/lab.py" en .env (archivo local, fuera de git)
      - "ECIRACE_LAB_TOKEN=${ECIRACE_LAB_TOKEN:?Ejecute primero python scripts/lab.py up}"
      - ECIRACE_TOKEN_SECRET=${ECIRACE_TOKEN_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - ECIRACE_ALLOWED_ORIGINS=${ECIRACE_ALLOWED_ORIGINS:-}
      # Pruebas de carga locales: sin límite por IP (todos los usuarios virtuales de k6 salen de la misma IP)
      - ECIRACE_RATELIMIT_ENABLED=false
      - ECIRACE_ROOMS_MAX=100000
      # Simulador de ruta y "simular victoria" para probar sin salir a correr
      - ECIRACE_DEMO_TOOLS=true
    restart: unless-stopped

  probe:
    build: ./monitoring/probe
    environment:
      - PROBE_URL=http://ecirace-server:8080/lab/ready
    depends_on: [ecirace-server]

  prometheus:
    image: prom/prometheus:v3.7.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver   # recibe las metricas en vivo de k6 (python scripts/lab.py proyecto ...)
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Ejecute primero python scripts/lab.py up}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]

  k6:
    image: grafana/k6:1.3.0
    profiles: [test]
    user: "0:0"
    environment:
      # Solo se usan cuando k6 corre con -o experimental-prometheus-rw (comando "proyecto")
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
      - K6_PROMETHEUS_RW_TREND_STATS=p(95),p(99),avg,max
      - K6_PROMETHEUS_RW_STALE_MARKERS=true
    volumes:
      - ./k6:/scripts:ro
      - ./results:/results

  # ARSW k6 JSON addon: results/*.json -> Prometheus -> tablero "k6 Resultados por ejecucion"
  k6-results:
    build: ./k6-grafana
    volumes:
      - ./results:/results:ro

volumes:
  grafana-data:
